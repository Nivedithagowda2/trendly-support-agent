<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trendly Support</title>
<style>
  :root { --ink:#f4f1ff; --muted:#a8a6c1; --line:#2b3150; --violet:#9b8cff; --lavender:#252445; --surface:#15182a; --panel:#1d2137; --shadow:0 22px 60px rgba(0,0,0,.34); }
  * { box-sizing:border-box; }
  body { min-height:100vh; margin:0; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:#090b15; overflow:hidden; }
  body::before, body::after { content:""; position:fixed; z-index:-1; width:45vw; height:45vw; border-radius:50%; filter:blur(6px); opacity:.6; }
  body::before { top:-22vw; left:-13vw; background:#34246e; animation:drift 14s ease-in-out infinite alternate; }
  body::after { right:-16vw; bottom:-24vw; background:#46233f; animation:drift 17s ease-in-out infinite alternate-reverse; }
  @keyframes drift { to { transform:translate(5vw,3vw) scale(1.12); } }
  .app { min-height:100vh; max-width:1260px; margin:auto; padding:24px; display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:22px; }
  .main { min-height:calc(100vh - 48px); padding:24px; display:flex; flex-direction:column; background:rgba(21,24,42,.88); border:1px solid rgba(172,160,255,.13); border-radius:28px; box-shadow:var(--shadow); backdrop-filter:blur(16px); }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:19px; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:12px; }.brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:14px; color:#191126; font-weight:800; font-size:20px; background:linear-gradient(135deg,#d3caff,#ff9a8f); box-shadow:0 8px 18px rgba(145,103,255,.28); }
  h1 { margin:0; font-size:17px; letter-spacing:-.02em; }.sub { margin-top:3px; font-size:12px; color:var(--muted); }.status-dot { display:inline-block; width:7px; height:7px; margin-right:5px; border-radius:50%; background:#2fc594; box-shadow:0 0 0 4px #e1f8f0; }
  button { font:inherit; }#resetBtn { border:1px solid var(--line); color:var(--muted); background:#20243a; padding:9px 12px; border-radius:10px; cursor:pointer; font-size:12px; transition:.2s ease; }#resetBtn:hover { color:#fff; border-color:#7e70db; background:#302d56; transform:translateY(-1px); }
  .intro { padding:18px 0 13px; }.intro h2 { margin:0 0 5px; font-size:18px; letter-spacing:-.03em; }.intro p { margin:0; color:var(--muted); font-size:13px; }
  .examples { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }.example { border:1px solid #37365d; background:#20233a; color:#cbc5ff; padding:8px 11px; border-radius:999px; font-size:12px; cursor:pointer; transition:.2s ease; }.example:hover { background:#302d56; border-color:#8a7ef1; color:#fff; transform:translateY(-2px); box-shadow:0 5px 14px rgba(91,76,220,.22); }
  #chat { flex:1; min-height:180px; overflow-y:auto; padding:10px 4px 18px; display:flex; flex-direction:column; gap:13px; scrollbar-width:thin; scrollbar-color:#5a5392 transparent; }.msg { max-width:min(82%,620px); padding:12px 15px; border-radius:17px; line-height:1.5; font-size:14px; white-space:pre-wrap; animation:message-in .3s cubic-bezier(.2,.8,.2,1) both; }@keyframes message-in { from { opacity:0; transform:translateY(9px) scale(.98); } to { opacity:1; transform:none; } }.msg.user { align-self:flex-end; color:#fff; background:linear-gradient(135deg,#9a62e8,#e65f9b); border-bottom-right-radius:5px; box-shadow:0 8px 18px rgba(176,74,201,.25); }.msg.bot { align-self:flex-start; background:#20243a; border:1px solid #343957; border-bottom-left-radius:5px; box-shadow:0 5px 15px rgba(0,0,0,.13); }.msg.system { align-self:flex-start; padding:8px 12px; color:var(--muted); font-size:12px; font-style:italic; }
  .typing { display:flex; gap:4px; align-items:center; min-height:28px; }.typing i { width:6px; height:6px; border-radius:50%; background:#8b83cf; animation:bounce 1s infinite; }.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}@keyframes bounce{50%{transform:translateY(-4px);opacity:.45}}
  #inputRow { display:flex; gap:10px; align-items:center; padding:12px; background:#1e2238; border:1px solid #343957; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,.18); transition:.2s; }#inputRow:focus-within { border-color:#8e7bf6; box-shadow:0 7px 24px rgba(118,87,244,.2); }#msgInput { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font-size:14px; padding:3px 5px; }#msgInput::placeholder { color:#878ba7; }#sendBtn { min-width:82px; padding:10px 15px; border:0; border-radius:11px; background:linear-gradient(135deg,#a868e8,#ef718f); color:#fff; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 7px 15px rgba(191,75,185,.25); transition:.2s ease; }#sendBtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 19px rgba(205,83,168,.35)}#sendBtn:disabled{opacity:.55;cursor:default}
  .side { padding:22px; align-self:start; border:1px solid rgba(172,160,255,.13); border-radius:24px; background:rgba(25,28,48,.86); box-shadow:var(--shadow); backdrop-filter:blur(16px); }.side h2 { margin:0 0 13px; font-size:11px; letter-spacing:.09em; color:var(--muted); text-transform:uppercase; }.empty { color:var(--muted); font-size:12.5px; line-height:1.5; }.ticket { padding:12px; margin-bottom:9px; background:#20243a; border:1px solid #343957; border-radius:13px; font-size:12px; animation:message-in .3s both; }.ticket .id { color:#bcb4ff; font-weight:700; }.ticket pre { margin:7px 0 0; color:var(--muted); white-space:pre-wrap; font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; }
  @media(max-width:880px){body{overflow:auto}.app{display:block;padding:14px}.main{min-height:calc(100vh - 28px);padding:18px;border-radius:22px}.side{display:none}.intro{padding-top:14px}.msg{max-width:88%}}@media(max-width:500px){header{align-items:flex-start}.brand-mark{width:37px;height:37px}#resetBtn{padding:8px}.intro h2{font-size:16px}.examples{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}.example{white-space:nowrap}.msg{font-size:13.5px}#sendBtn{min-width:62px;padding:10px}}
</style>
</head>
<body>
<div class="app"><main class="main"><header><div class="brand"><div class="brand-mark">T</div><div><h1>Trendly Support</h1><div class="sub" id="providerLabel">Connecting...</div></div></div><button id="resetBtn">New chat</button></header><section class="intro"><h2>How can we help today?</h2><p>Ask about an order, delivery, returns, or exchanges.</p></section><div class="examples"><button class="example" data-msg="Hi, can you tell me the status of order TR-4525?">Track an order</button><button class="example" data-msg="What's your return window?">Return policy</button><button class="example" data-msg="I want to return order TR-4523, is that possible?">Start a return</button><button class="example" data-msg="My order TR-4526 never arrived, what happened to it?">Missing order</button></div><div id="chat" aria-live="polite"></div><div id="inputRow"><input id="msgInput" type="text" placeholder="Type your message..." autocomplete="off" /><button id="sendBtn">Send</button></div></main><aside class="side"><h2>Tickets this session</h2><div id="tickets"><div class="empty">No tickets raised yet. Any return or support requests will appear here.</div></div></aside></div>
<script>
let sessionId=localStorage.getItem("trendly_session_id")||null;const chatEl=document.getElementById("chat"),inputEl=document.getElementById("msgInput"),sendBtn=document.getElementById("sendBtn"),ticketsEl=document.getElementById("tickets"),providerLabel=document.getElementById("providerLabel");fetch("/health").then(r=>r.json()).then(d=>providerLabel.innerHTML=`<span class="status-dot"></span>Online with ${d.provider}`).catch(()=>providerLabel.textContent="Offline");
function addMsg(role,text){const div=document.createElement("div");div.className="msg "+role;div.textContent=text;chatEl.appendChild(div);chatEl.scrollTop=chatEl.scrollHeight;return div}function renderTickets(tickets){if(!tickets||!tickets.length)return;ticketsEl.innerHTML="";tickets.slice().reverse().forEach(t=>{const div=document.createElement("div");div.className="ticket";const{ticket_id,kind,...rest}=t;div.innerHTML=`<span class="id">${ticket_id}</span> &middot; ${kind}<pre>${JSON.stringify(rest,null,1)}</pre>`;ticketsEl.appendChild(div)})}
async function send(text){if(!text.trim())return;addMsg("user",text);inputEl.value="";sendBtn.disabled=true;const thinking=document.createElement("div");thinking.className="msg bot typing";thinking.setAttribute("aria-label","Trendly is typing");thinking.innerHTML="<i></i><i></i><i></i>";chatEl.appendChild(thinking);chatEl.scrollTop=chatEl.scrollHeight;try{const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId,message:text})});const data=await res.json();thinking.remove();if(!res.ok){addMsg("bot","Error: "+(data.detail||res.statusText));return}sessionId=data.session_id;localStorage.setItem("trendly_session_id",sessionId);addMsg("bot",data.reply);renderTickets(data.tickets)}catch(e){thinking.remove();addMsg("bot","Network error: "+e.message)}finally{sendBtn.disabled=false;inputEl.focus()}}
sendBtn.addEventListener("click",()=>send(inputEl.value));inputEl.addEventListener("keydown",e=>{if(e.key==="Enter")send(inputEl.value)});document.querySelectorAll(".example").forEach(el=>el.addEventListener("click",()=>send(el.dataset.msg)));document.getElementById("resetBtn").addEventListener("click",async()=>{if(sessionId)await fetch("/api/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId})});sessionId=null;localStorage.removeItem("trendly_session_id");chatEl.innerHTML="";ticketsEl.innerHTML='<div class="empty">No tickets raised yet. Any return or support requests will appear here.</div>';addMsg("bot","Hi! I am Trendly's support assistant. I can check an order status, answer policy questions, or help start a return or exchange. What can I help with?")});addMsg("bot","Hi! I am Trendly's support assistant. I can check an order status, answer policy questions, or help start a return or exchange. What can I help with?");
</script></body></html>
